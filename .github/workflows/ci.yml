name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 工厂自检
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 检出
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 安装检查工具
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck python3-yaml

      - name: shellcheck（只报 error，先不卡风格）
        run: |
          shellcheck -S error \
            tools/*.sh \
            templates/cmd/main \
            templates/cmd/uninstall_init \
            templates/cmd/uninstall_callback \
            templates/tests/accept.sh \
            tests/run.sh

      - name: 回归测试
        run: bash tests/run.sh
