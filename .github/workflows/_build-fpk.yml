name: Build FPK (reusable)

# 通用打包流水线。三类应用（二进制 / Node-Python / Docker）都用这一条，
# 差异只在应用仓库里的 packaging/build.sh 产出了什么。
#
# 架构：
#   build   job：按矩阵在原生 runner 上产出 payload（不执行 fnpack）
#   package job：在单个 x86 runner 上用 amd64 fnpack 统一打包两个架构
#                —— fnpack 只打包、不执行包内文件，因此不需要 qemu
#   release job：创建 Release 并上传 .fpk
#   publish job：写回索引（可关闭）
#
# 调用方式（应用仓库的 .github/workflows/release.yml）：
#   jobs:
#     build:
#       permissions: { contents: write }  # release job 需要写 Release
#       uses: bekafka/FnFactory/.github/workflows/_build-fpk.yml@v1
#       with:
#         app_key:      MyApp
#         version:      "1.2.3"              # 不带前导 v
#         changelog:    "本次更新说明"
#         template_dir: packaging/MyApp
#         build_script: packaging/build.sh
#         publish:      true
#       secrets:
#         FNDEPOT_TOKEN: ${{ secrets.FNDEPOT_TOKEN }}
#
# 应用仓库必须提供的契约（见 examples/）：
#   <template_dir>/manifest, config/, cmd/, wizard/, app/   ← fnOS 包模板
#   <build_script>                                          ← 产出产物到 $PAYLOAD_DIR
#
# 安全约定：
#   · build job 只有 contents: read，build.sh 不应拿到可写 token；
#   · 所有 inputs 先经 env + 白名单校验，再进入 shell；
#   · 发布/写索引在独立 job 中，只有那里才给 contents: write。

on:
  workflow_call:
    inputs:
      app_key:
        description: 'fnOS 应用名，必须逐字等于包内 manifest 的 appname'
        required: true
        type: string
      version:
        description: '包版本号（写进 manifest 的 version；不带前导 v）'
        required: true
        type: string
      changelog:
        description: '更新日志（支持中文；多行会被规范化为单行）'
        required: true
        type: string
      matrix:
        description: '构建矩阵 JSON（include 数组，每项需 os/arch/platform；arch=amd64|arm64，platform=x86|arm|all）'
        required: false
        type: string
        default: '{"include":[{"os":"ubuntu-24.04","arch":"amd64","platform":"x86"},{"os":"ubuntu-24.04-arm","arch":"arm64","platform":"arm"}]}'
      template_dir:
        description: '包模板目录本身（含 manifest/cmd/wizard/config）；留空 = packaging/<app_key>'
        required: false
        type: string
        default: ''
      build_script:
        description: '产出 payload 的脚本路径（相对调用方仓库根）'
        required: false
        type: string
        default: 'packaging/build.sh'
      release_tag:
        description: 'Release tag；留空则用 <app_key>-v<version>'
        required: false
        type: string
        default: ''
      asset_pattern:
        description: '资产名模板，支持 {app} {version} {arch}（arch 即 platform）'
        required: false
        type: string
        default: '{app}-{version}-{arch}.fpk'
      publish:
        description: '是否写回 FnDepot 索引'
        required: false
        type: boolean
        default: true
      fndepot_repo:
        description: '索引仓库（集中式模型：只存元数据，资产留在本仓库）'
        required: false
        type: string
        default: 'bekafka/FnDepot'
      factory_repo:
        description: '打包厂仓库（提供 fnpack 工具）'
        required: false
        type: string
        default: 'bekafka/FnFactory'
      factory_ref:
        description: '打包厂 ref（建议固定到 tag/commit，不要长期用 main）'
        required: false
        type: string
        default: 'main'
      fetch_depth:
        description: '检出应用仓库的 fetch-depth；只需要打包时 1 即可'
        required: false
        type: number
        default: 1
      needs_go:
        description: 'build.sh 需要 Go 工具链时设为 true'
        required: false
        type: boolean
        default: false
      go_version:
        description: 'setup-go 的版本；默认 stable，建议改为 go.mod 的版本'
        required: false
        type: string
        default: 'stable'
      go_cache:
        description: '是否启用 setup-go 缓存'
        required: false
        type: boolean
        default: true
      glibc_max:
        description: 'payload 内 ELF 允许的最高 GLIBC 版本；fnOS 1.x 实测 2.36'
        required: false
        type: string
        default: '2.36'
    outputs:
      tag:
        description: '本次发布使用的 tag'
        value: ${{ jobs.release.outputs.tag }}
      version:
        value: ${{ inputs.version }}
      changelog:
        value: ${{ inputs.changelog }}
    secrets:
      FNDEPOT_TOKEN:
        description: '对索引仓库有 contents:write 的 PAT'
        required: false

permissions:
  contents: read

concurrency:
  group: fpk-${{ github.repository }}-${{ inputs.app_key }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  # ══════════════════════════════════════════════════════════════════
  build:
    name: 构建 payload ${{ matrix.platform }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: 检出应用仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.fetch_depth }}
          persist-credentials: false

      - name: 检出打包厂（提供 lint 工具）
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.factory_repo }}
          ref: ${{ inputs.factory_ref }}
          path: .factory
          persist-credentials: false

      - name: 校验输入与契约
        env:
          APP_KEY: ${{ inputs.app_key }}
          VERSION: ${{ inputs.version }}
          TEMPLATE_DIR: ${{ inputs.template_dir }}
          BUILD_SCRIPT: ${{ inputs.build_script }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          MATRIX: ${{ inputs.matrix }}
        run: |
          set -euo pipefail

          # app_key 会进入路径/资产名/tag，必须限制为安全字符
          printf '%s' "$APP_KEY" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]*$' || {
            echo "::error::app_key 只能包含字母、数字、点、下划线、连字符：$APP_KEY"; exit 1; }
          # 版本号会进入路径/URL；拒绝前导 v、斜杠、空白
          printf '%s' "$VERSION" | grep -Eq '^[0-9][0-9A-Za-z._+-]*$' || {
            echo "::error::version 不合法（期望 x.y.z[-suffix]，不带前导 v）：$VERSION"; exit 1; }

          TEMPLATE_DIR="${TEMPLATE_DIR:-packaging/$APP_KEY}"
          case "$TEMPLATE_DIR" in
            /*|*..*) echo "::error::template_dir 必须是仓库内相对路径：$TEMPLATE_DIR"; exit 1 ;;
          esac
          case "$BUILD_SCRIPT" in
            /*|*..*) echo "::error::build_script 必须是仓库内相对路径：$BUILD_SCRIPT"; exit 1 ;;
          esac
          [ -d "$TEMPLATE_DIR" ] || {
            echo "::error::缺少包模板目录 $TEMPLATE_DIR"; exit 1; }
          [ -f "$TEMPLATE_DIR/manifest" ] || {
            echo "::error::模板里缺少 manifest"; exit 1; }
          [ -f "$BUILD_SCRIPT" ] || {
            echo "::error::缺少构建脚本 $BUILD_SCRIPT"; exit 1; }

          if [ -n "$RELEASE_TAG" ]; then
            printf '%s' "$RELEASE_TAG" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]*$' || {
              echo "::error::release_tag 含非法字符：$RELEASE_TAG"; exit 1; }
          fi

          MATRIX="$MATRIX" python3 - <<'PY'
          import json, os
          raw = os.environ["MATRIX"]
          try:
              data = json.loads(raw)
          except Exception as exc:
              raise SystemExit(f"matrix 不是合法 JSON: {exc}")
          items = data.get("include")
          if not isinstance(items, list) or not items:
              raise SystemExit("matrix.include 必须是非空数组")
          seen = set()
          for item in items:
              if not isinstance(item, dict):
                  raise SystemExit("matrix.include 的每一项必须是对象")
              if not item.get("os"):
                  raise SystemExit("matrix 项缺少 os")
              if item.get("arch") not in ("amd64", "arm64"):
                  raise SystemExit(f"matrix arch 只能是 amd64/arm64: {item.get('arch')!r}")
              if item.get("platform") not in ("x86", "arm", "all"):
                  raise SystemExit(f"matrix platform 只能是 x86/arm/all: {item.get('platform')!r}")
              if item["platform"] in seen:
                  raise SystemExit(f"matrix platform 重复：{item['platform']}")
              seen.add(item["platform"])
          print("✓ matrix 合法")
          PY

          echo "TEMPLATE_DIR=$TEMPLATE_DIR" >> "$GITHUB_ENV"
          echo "BUILD_SCRIPT=$BUILD_SCRIPT" >> "$GITHUB_ENV"
          echo "✓ 契约完整：app=$APP_KEY version=$VERSION template=$TEMPLATE_DIR"

      - name: 校验打包规范（specs/）
        run: |
          set -euo pipefail
          bash .factory/tools/lint-package.sh "$TEMPLATE_DIR"

      - name: 准备 Go 工具链（应用声明需要时）
        if: inputs.needs_go || hashFiles(format('apps/{0}/packaging/needs-go', inputs.app_key)) != ''
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go_version }}
          cache: ${{ inputs.go_cache }}

      - name: 组装工作区（模板 + payload）
        env:
          APP_KEY: ${{ inputs.app_key }}
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ inputs.version }}
          REPO_ROOT: ${{ github.workspace }}
          PAYLOAD_DIR: ${{ github.workspace }}/build_workspace/${{ inputs.app_key }}/app
        run: |
          set -euo pipefail
          rm -rf build_workspace && mkdir -p build_workspace
          cp -r "$TEMPLATE_DIR" "build_workspace/$APP_KEY"
          mkdir -p "$PAYLOAD_DIR"

          # 由应用自己的脚本产出 payload —— 三类应用的唯一差异点就在这里
          bash "$BUILD_SCRIPT"

          if ! find "$PAYLOAD_DIR" -type f -print -quit | grep -q .; then
            echo "::error::build.sh 没有向 PAYLOAD_DIR 写入任何文件：$PAYLOAD_DIR"
            exit 1
          fi
          echo "--- payload 内容（前 40 个文件）---"
          find "$PAYLOAD_DIR" -type f | head -40 || true
          echo "--- payload 大小 ---"
          du -sh "$PAYLOAD_DIR" || true

      - name: 检查 payload 的 glibc 基线
        env:
          GLIBC_MAX: ${{ inputs.glibc_max }}
          PAYLOAD_DIR: ${{ github.workspace }}/build_workspace/${{ inputs.app_key }}/app
        run: |
          set -euo pipefail
          bash .factory/tools/check-glibc.sh "$GLIBC_MAX" "$PAYLOAD_DIR"

      - name: 上传 payload
        uses: actions/upload-artifact@v4
        with:
          # 名字必须带 app_key：调用方可能在一个 run 里矩阵化跑多个应用
          # （FnDepot 的 auto-release.yml 就是这样）。artifact 名在 run 内全局唯一，
          # 只写 payload-<platform>-<arch> 会让两个应用的 payload 同名并存，
          # 下游 package job 的 pattern 匹配会把别的应用的 payload 一起下下来，
          # 用本应用的模板去装它 → "manifest appname='X' != app_key='Y'"。
          name: payload-${{ inputs.app_key }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: build_workspace/${{ inputs.app_key }}
          if-no-files-found: error

  # ══════════════════════════════════════════════════════════════════
  package:
    name: 统一打包
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: 检出打包厂（fnpack + manifest 渲染）
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.factory_repo }}
          ref: ${{ inputs.factory_ref }}
          path: .factory
          persist-credentials: false

      - name: 下载所有 payload
        uses: actions/download-artifact@v8
        with:
          # 只取本应用的 payload。一个 run 里可能同时构建多个应用
          # （FnDepot 的 auto-release.yml 矩阵化调用），用 payload-* 会把
          # 别的应用的 payload 也下下来，导致用错模板打包。
          pattern: payload-${{ inputs.app_key }}-*
          path: payloads
          merge-multiple: false
          if-no-files-found: error

      - name: 准备 fnpack 工具（带 sha256 校验）
        env:
          FNPACK_ARCH: amd64
        run: |
          set -euo pipefail
          cp ".factory/tools/fnpack-linux-amd64" ./fnpack
          chmod +x ./fnpack
          ACTUAL=$(sha256sum ./fnpack | awk '{print $1}')
          EXPECTED=$(awk -v name="fnpack-linux-${FNPACK_ARCH}" '$2 == name {print $1}' .factory/tools/SHA256SUMS)
          [ -n "$EXPECTED" ] || {
            echo "::error::tools/SHA256SUMS 里找不到 fnpack-linux-${FNPACK_ARCH}"; exit 1; }
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::fnpack 哈希不符：期望 $EXPECTED 实际 $ACTUAL"; exit 1
          fi
          echo "✓ fnpack sha256=$ACTUAL"
          ./fnpack --help >/tmp/fnpack-help.txt 2>&1 || {
            cat /tmp/fnpack-help.txt; echo "::error::fnpack 无法执行"; exit 1; }

      - name: 打包所有架构
        env:
          APP_KEY: ${{ inputs.app_key }}
          VERSION: ${{ inputs.version }}
          CHANGELOG: ${{ inputs.changelog }}
          PATTERN: ${{ inputs.asset_pattern }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # 目录名形如 payload-<app_key>-<platform>-<arch>（app_key 由上游 job 带入）。
          dirs=(payloads/payload-"$APP_KEY"-*)
          [ "${#dirs[@]}" -gt 0 ] || {
            echo "::error::没有下载到 payload（期望 payloads/payload-${APP_KEY}-*）"; exit 1; }

          for dir in "${dirs[@]}"; do
            name="$(basename "$dir")"
            rest="${name#payload-"$APP_KEY"-}"
            if [ "$rest" = "$name" ]; then
              echo "::error::artifact 名不含应用前缀 $APP_KEY：$name"; exit 1
            fi
            platform="${rest%%-*}"
            arch="${rest#*-}"

            rm -rf build_workspace
            mkdir -p build_workspace
            cp -r "$dir" "build_workspace/$APP_KEY"

            APP_KEY="$APP_KEY" VERSION="$VERSION" PLATFORM="$platform" CHANGELOG="$CHANGELOG" \
              python3 .factory/tools/render-manifest.py "build_workspace/$APP_KEY/manifest"

            if ! ( cd build_workspace && ../fnpack build "$APP_KEY" 2>&1 | tee "/tmp/fnpack-${platform}-${arch}.log" ); then
              echo "::error::fnpack 退出码非 0（$platform/$arch）"
              exit 1
            fi
            grep -q 'Packing successfully' "/tmp/fnpack-${platform}-${arch}.log" || {
              echo "::error::fnpack 没有报告 Packing successfully（$platform/$arch）"
              exit 1
            }
            mapfile -t FPK < <(find build_workspace -maxdepth 1 -type f -name '*.fpk')
            if [ "${#FPK[@]}" -ne 1 ]; then
              echo "::error::期望恰好 1 个 .fpk（$platform/$arch），实际 ${#FPK[@]} 个"
              exit 1
            fi
            asset="${PATTERN//\{app\}/$APP_KEY}"
            asset="${asset//\{version\}/$VERSION}"
            asset="${asset//\{arch\}/$platform}"
            case "$asset" in
              ''|*/*|*..*) echo "::error::asset_pattern 生成了非法文件名：$asset"; exit 1 ;;
            esac
            mv "${FPK[0]}" "$asset"
            echo "✓ $asset"
          done

      - name: 上传 FPK
        uses: actions/upload-artifact@v4
        with:
          # 同样要带 app_key：一个 run 里多个应用时 fpk-all 会重名冲突。
          name: fpk-${{ inputs.app_key }}
          path: '*.fpk'
          if-no-files-found: error

  # ══════════════════════════════════════════════════════════════════
  release:
    name: 创建 Release
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: 检出应用仓库（gh release 需要仓库上下文）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: 下载所有架构的 FPK
        uses: actions/download-artifact@v8
        with:
          # 只取本应用的 FPK，避免多应用同 run 时把别人的包也发进本应用的 Release。
          pattern: fpk-${{ inputs.app_key }}
          merge-multiple: true
          path: dist
          if-no-files-found: error

      - name: 确定 tag
        id: tag
        env:
          APP_KEY: ${{ inputs.app_key }}
          IN_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$IN_TAG" ]; then TAG="$IN_TAG"; else TAG="${APP_KEY}-v${VERSION}"; fi
          case "$TAG" in
            "${APP_KEY}-v"*) ;;
            *) echo "::error::Release tag 必须以 ${APP_KEY}-v 开头（防止多应用撞 tag）：$TAG"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"

      - name: 创建/更新 Release 并上传
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ inputs.version }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          set -euo pipefail
          ls -la dist
          PRERELEASE=()
          case "$VERSION" in *-*) PRERELEASE=(--prerelease) ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，更新 notes 并覆盖资产"
            gh release edit "$TAG" --title "$TAG" --notes "$CHANGELOG"
          else
            gh release create "$TAG" --title "$TAG" --notes "$CHANGELOG" "${PRERELEASE[@]}"
          fi
          for f in dist/*.fpk; do
            [ -e "$f" ] || { echo "::error::dist 里没有 .fpk"; exit 1; }
            gh release upload "$TAG" "$f" --clobber
          done

  # ══════════════════════════════════════════════════════════════════
  publish:
    name: 写回 FnDepot 索引
    needs: [build, release]
    if: ${{ inputs.publish }}
    permissions:
      contents: write
    uses: bekafka/FnFactory/.github/workflows/_publish-index.yml@v1
    with:
      app_key:      ${{ inputs.app_key }}
      version:      ${{ inputs.version }}
      changelog:    ${{ inputs.changelog }}
      release_tag:  ${{ needs.release.outputs.tag }}
      source_repo:  ${{ github.repository }}
      fndepot_repo: ${{ inputs.fndepot_repo }}
      asset_pattern: ${{ inputs.asset_pattern }}
    secrets:
      FNDEPOT_TOKEN: ${{ secrets.FNDEPOT_TOKEN }}
